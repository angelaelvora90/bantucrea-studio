<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BantuCrea Studio — NetArch · Concepteur d’architecture réseau</title>
  <meta name="description" content="Studio web de conception, de visualisation et d’audit d’architecture réseau d’entreprise : schémas, zones, VLAN, pare-feu, plan d’adressage.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322d3ee'/%3E%3Cpath d='M16 5v22M5 16h22' stroke='%2304121a' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%2304121a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles/app.css">
</head>
<body>
<div class="app">

  <!-- ── Barre supérieure ─────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">BC</div>
      <div class="brand-txt">
        <b>BantuCrea Studio</b>
        <span>NetArch</span>
      </div>
    </div>

    <div class="project-name">
      <input id="project-name" value="Nouvelle architecture" aria-label="Nom de l’architecture">
    </div>

    <div class="toolbar">
      <button class="icon-btn" id="btn-undo" title="Annuler (Ctrl+Z)">↶</button>
      <button class="icon-btn" id="btn-redo" title="Rétablir (Ctrl+Y)">↷</button>
      <span class="sep"></span>
      <button class="btn ghost" id="btn-preset" title="Charger un modèle">Modèles ▾</button>
      <button class="btn ghost" id="btn-layout" title="Réorganisation automatique">Disposition ▾</button>
      <span class="sep"></span>
      <button class="btn" id="btn-import" title="Importer un schéma (.json)">Importer</button>
      <button class="btn primary" id="btn-export" title="Exporter">Exporter ▾</button>
      <button class="icon-btn" id="btn-save" title="Enregistrer dans le navigateur (Ctrl+S)">💾</button>
    </div>
  </header>

  <!-- ── Espace de travail ────────────────────────────────────────────────── -->
  <main class="workspace">

    <!-- Palette -->
    <aside class="panel-left">
      <div class="pal-search">
        <input id="palette-search" placeholder="Rechercher un équipement…" autocomplete="off">
      </div>
      <div id="palette-items"></div>
      <div class="pal-tools">
        <button class="btn" id="btn-new-zone">＋ Nouvelle zone / VLAN</button>
        <button class="btn" id="btn-tidy-zones">⤢ Ajuster les zones</button>
      </div>
    </aside>

    <!-- Canvas -->
    <section class="canvas-wrap" id="canvas-wrap">
      <svg id="canvas-svg" aria-label="Schéma de l’architecture réseau"></svg>

      <div class="legend">
        <span style="color:#22d3ee"><i></i> Fibre</span>
        <span style="color:#94a3b8"><i></i> Cuivre</span>
        <span style="color:#a78bfa"><i></i> Trunk 802.1Q</span>
        <span style="color:#f472b6"><i style="border-top-style:dashed"></i> Sans-fil</span>
        <span style="color:#c084fc"><i style="border-top-style:dotted"></i> VPN</span>
        <span style="color:#ef4444"><i style="border-top-style:dashed"></i> Liaison down</span>
      </div>

      <div class="canvas-tools">
        <button class="icon-btn" id="btn-zoom-out" title="Dézoomer (−)">−</button>
        <span class="zoom-val" id="zoom-val">100 %</span>
        <button class="icon-btn" id="btn-zoom-in" title="Zoomer (+)">＋</button>
        <button class="icon-btn" id="btn-fit" title="Cadrer (F)">⤢</button>
        <span class="sep" style="width:1px;height:20px;background:var(--line)"></span>
        <button class="icon-btn on" id="btn-flows" title="Animer les flux">≈</button>
        <button class="icon-btn on" id="btn-snap" title="Aimanter à la grille">▦</button>
      </div>
    </section>

    <!-- Inspecteur -->
    <aside class="panel-right">
      <nav class="tabs">
        <button class="tab active" data-tab="props">Propriétés</button>
        <button class="tab" data-tab="firewall">Pare-feu</button>
        <button class="tab" data-tab="subnet">Adressage</button>
        <button class="tab" data-tab="audit">Audit <span class="tab-badge" hidden>0</span></button>
      </nav>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </main>

  <footer class="statusbar" id="status-bar"></footer>
</div>

<!-- Menus déroulants -->
<div class="dropdown" id="menu-preset"></div>
<div class="dropdown" id="menu-layout"></div>
<div class="dropdown" id="menu-export"></div>

<input type="file" id="file-import" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
